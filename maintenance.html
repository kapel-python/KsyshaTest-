<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="pageTitle">Технический перерыв</title>
<script>
(function(){
  var theme = typeof localStorage !== 'undefined' && localStorage.getItem('memories_theme');
  if (!theme && typeof window.matchMedia === 'function')
    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root, html.theme-dark {
  --bg: #0d0b14;
  --surface: #18152a;
  --surface2: #201c35;
  --accent: #d43f8d;
  --accent2: #7c3aed;
  --accent3: #4158d0;
  --text: #f0ecff;
  --muted: #9080b0;
  --meta: #5a4a78;
  --border: rgba(212,63,141,0.18);
}
html.theme-light {
  --bg: #fdf6f9;
  --surface: #ffffff;
  --surface2: #fce4f2;
  --accent: #d43f8d;
  --accent2: #7c3aed;
  --accent3: #4158d0;
  --text: #1a1a2e;
  --muted: #9b7fa8;
  --meta: #6a5880;
  --border: rgba(212,63,141,0.22);
}
html.theme-light .star { background: #d43f8d; opacity: 0.15; }
html.theme-light .bg-orb.o1 { background: radial-gradient(circle, rgba(212,63,141,0.12), transparent); }
html.theme-light .bg-orb.o2 { background: radial-gradient(circle, rgba(65,88,208,0.08), transparent); }
html.theme-light .bg-orb.o3 { background: radial-gradient(circle, rgba(124,58,237,0.06), transparent); }
html.theme-light .timer-bar-bg { background: rgba(0,0,0,0.08); }
html.theme-light .fact-box { border-color: rgba(212,63,141,0.2); }
html.theme-light .stg-lang-btn { border-color: rgba(0,0,0,0.08); }
html.theme-light .stg-lang-btn.active { background: rgba(212,63,141,0.1); }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-x: hidden;
  position: relative;
}

/* ── Анимированный фон ── */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(80px);
  animation: orbFloat 8s ease-in-out infinite;
}
.bg-orb.o1 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(212,63,141,0.15), transparent);
  top: -100px; right: -100px;
  animation-delay: 0s;
}
.bg-orb.o2 {
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(65,88,208,0.12), transparent);
  bottom: -80px; left: -80px;
  animation-delay: 3s;
}
.bg-orb.o3 {
  width: 250px; height: 250px;
  background: radial-gradient(circle, rgba(124,58,237,0.1), transparent);
  top: 40%; left: 50%;
  transform: translateX(-50%);
  animation-delay: 1.5s;
}

@keyframes orbFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.05); }
}

/* ── Звёздочки ── */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.star {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--d) ease-in-out infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: var(--opacity); transform: scale(1); }
}

/* ── Основной контент ── */
.page {
  max-width: 480px;
  width: 100%;
  padding: 48px 20px 60px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* ── Иконка ── */
.icon-wrap {
  width: 88px; height: 88px;
  border-radius: 28px;
  background: linear-gradient(135deg, #d43f8d, #7c3aed);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.4rem;
  box-shadow: 0 16px 48px rgba(212,63,141,0.35);
  animation: iconPulse 2s ease-in-out infinite;
  position: relative;
}
.icon-wrap::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 32px;
  background: linear-gradient(135deg, #d43f8d, #7c3aed);
  opacity: 0.2;
  animation: iconRing 2s ease-in-out infinite;
}
@keyframes iconPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 16px 48px rgba(212,63,141,0.35); }
  50% { transform: scale(1.05); box-shadow: 0 20px 56px rgba(212,63,141,0.5); }
}
@keyframes iconRing {
  0%, 100% { transform: scale(1); opacity: 0.2; }
  50% { transform: scale(1.15); opacity: 0; }
}

/* ── Заголовок ── */
.main-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 7vw, 2.4rem);
  font-weight: 900;
  text-align: center;
  line-height: 1.2;
  color: var(--text);
}
.main-title em {
  font-style: italic;
  background: linear-gradient(135deg, #ff9fd4, #7c3aed);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.main-sub {
  font-size: 0.92rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
  max-width: 340px;
}

/* ── Таймер ── */
.timer-card {
  width: 100%;
  background: var(--surface);
  border-radius: 24px;
  padding: 24px 20px;
  border: 1px solid var(--border);
  text-align: center;
}

.timer-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}

.timer-digits {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4px;
}

.timer-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.timer-num {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem;
  font-weight: 900;
  line-height: 1;
  background: linear-gradient(135deg, #ff9fd4, #d43f8d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  min-width: 56px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.timer-unit-label {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--meta);
}

.timer-sep {
  font-size: 2rem;
  font-weight: 700;
  color: var(--meta);
  margin-bottom: 16px;
  animation: sepBlink 1s step-end infinite;
}
@keyframes sepBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

.timer-bar-bg {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 20px;
}
.timer-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #d43f8d, #7c3aed);
  animation: barPulse 2s ease-in-out infinite;
}
@keyframes barPulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* ── Карточка "Пока ты ждёшь" ── */
.while-card {
  width: 100%;
  background: var(--surface);
  border-radius: 24px;
  padding: 22px 20px;
  border: 1px solid var(--border);
}

.while-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.while-icon {
  width: 36px; height: 36px;
  background: rgba(212,63,141,0.15);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.while-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
}
.while-sub { font-size: 0.75rem; color: var(--muted); }

.fact-box {
  background: var(--surface2);
  border-radius: 16px;
  padding: 16px;
  border: 1px solid rgba(255,255,255,0.05);
  position: relative;
  min-height: 80px;
  display: flex;
  align-items: center;
}

.fact-text {
  font-size: 0.92rem;
  color: var(--text);
  line-height: 1.6;
  font-style: italic;
  opacity: 0;
  animation: factFade 0.5s ease forwards;
}

@keyframes factFade {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.fact-num {
  position: absolute;
  top: 10px; right: 12px;
  font-size: 0.65rem;
  color: var(--meta);
  font-weight: 600;
}

.fact-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}
.fact-dots {
  display: flex;
  gap: 5px;
}
.fact-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--meta);
  transition: background 0.2s, transform 0.2s;
  cursor: pointer;
}
.fact-dot.active {
  background: var(--accent);
  transform: scale(1.3);
}
.fact-btn {
  background: rgba(212,63,141,0.12);
  border: 1px solid rgba(212,63,141,0.2);
  color: var(--accent);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}
.fact-btn:hover { background: rgba(212,63,141,0.22); }


/* ── Статус ── */
.status-card {
  width: 100%;
  background: var(--surface);
  border-radius: 24px;
  padding: 18px 20px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
}

.status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #f59e0b;
  flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(245,158,11,0.4);
  animation: statusPulse 1.5s ease-in-out infinite;
}
@keyframes statusPulse {
  0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); }
  70% { box-shadow: 0 0 0 8px rgba(245,158,11,0); }
  100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
}

.status-text { font-size: 0.85rem; color: var(--muted); flex: 1; }
.status-text strong { color: var(--text); font-weight: 600; }

/* ── Языки ── */
.stg-lang {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
}
.stg-lang-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--muted);
}
.stg-lang-btn .stg-flag { font-size: 1.4rem; }
.stg-lang-btn .stg-lang-label { font-size: 0.75rem; font-weight: 600; }
.stg-lang-btn.active {
  background: rgba(212,63,141,0.15);
  border-color: var(--accent);
  color: var(--text);
}
.stg-lang-btn:hover:not(.active) {
  border-color: var(--accent);
  color: var(--text);
}

/* ── Темы ── */
.stg-lbl {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
}
.stg-pills { display: flex; gap: 7px; width: 100%; margin-bottom: 8px; }
.stg-pill {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
}
.stg-pill.active {
  background: rgba(212,63,141,0.15);
  border-color: var(--accent);
  color: var(--text);
}
.stg-pill:hover:not(.active) {
  border-color: var(--accent);
  color: var(--text);
}
html.theme-light .stg-pill.active { background: rgba(212,63,141,0.1); }
html.theme-light .stg-pill { border-color: rgba(0,0,0,0.08); }

/* ── Анимации появления ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.icon-wrap     { animation: fadeUp 0.4s 0.0s ease both; }
.main-title    { animation: fadeUp 0.4s 0.08s ease both; }
.main-sub      { animation: fadeUp 0.4s 0.14s ease both; }
.timer-card    { animation: fadeUp 0.4s 0.2s ease both; }
.status-card   { animation: fadeUp 0.4s 0.26s ease both; }
.while-card    { animation: fadeUp 0.4s 0.32s ease both; }
.lang-switcher { animation: fadeUp 0.4s 0.38s ease both; }
</style>
</head>
<body>

<!-- Фон -->
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="bg-orb o3"></div>
<div class="stars" id="stars"></div>

<div class="page">

  <!-- Иконка -->
  <div class="icon-wrap">🔧</div>

  <!-- Заголовок -->
  <h1 class="main-title" data-i18n-html="mainTitleHTML">Идёт<br><em>технический</em><br>перерыв</h1>
  <p class="main-sub" data-i18n-html="maintenanceSubtitle">{{MAINTENANCE_SUBTITLE}}</p>

  <!-- Таймер -->
  <div class="timer-card">
    <div class="timer-label" data-i18n="timerLabel">Перерыв длится уже</div>
    <div class="timer-digits">
      <div class="timer-unit">
        <div class="timer-num" id="t-hours">00</div>
        <div class="timer-unit-label" data-i18n="tHours">часов</div>
      </div>
      <div class="timer-sep">:</div>
      <div class="timer-unit">
        <div class="timer-num" id="t-mins">00</div>
        <div class="timer-unit-label" data-i18n="tMins">минут</div>
      </div>
      <div class="timer-sep">:</div>
      <div class="timer-unit">
        <div class="timer-num" id="t-secs">00</div>
        <div class="timer-unit-label" data-i18n="tSecs">секунд</div>
      </div>
    </div>
    <div class="timer-bar-bg">
      <div class="timer-bar-fill" id="timerBar" style="width: 100%"></div>
    </div>
  </div>

  {{MAINTENANCE_VISITS_BLOCK}}
  <!-- Статус -->
  <div class="status-card">
    <div class="status-dot"></div>
    <div class="status-text" data-i18n-html="statusHTML"><strong>В процессе</strong>, страница обновится сама когда всё будет готово</div>
  </div>

  <!-- Пока ждёшь: факты -->
  <div class="while-card">
    <div class="while-header">
      <div class="while-icon">💡</div>
      <div>
        <div class="while-title" data-i18n="whileTitle">Пока ты ждёшь</div>
        <div class="while-sub" data-i18n="whileSub">Интересный факт чтобы не скучать</div>
      </div>
    </div>
    <div class="fact-box">
      <div class="fact-text" id="factText"></div>
      <div class="fact-num" id="factNum"></div>
    </div>
    <div class="fact-nav">
      <div class="fact-dots" id="factDots"></div>
      <button class="fact-btn" id="factNext" data-i18n="factNext">Следующий →</button>
    </div>
  </div>


  <!-- Тема -->
  <div class="stg-lbl" data-i18n="sTheme">Тема</div>
  <div class="stg-pills theme-switcher">
    <button class="stg-pill active" data-theme="dark"><span data-i18n="tDark">🌙 Тёмная</span></button>
    <button class="stg-pill" data-theme="light"><span data-i18n="tLight">☀️ Светлая</span></button>
  </div>

  <!-- Языки -->
  <div class="stg-lbl" data-i18n="sLang" style="margin-top: 12px;">Язык</div>
  <div class="stg-lang lang-switcher">
    <button class="stg-lang-btn active" data-lang="ru">
      <div class="stg-flag">🇷🇺</div>
      <div class="stg-lang-label">Русский</div>
    </button>
    <button class="stg-lang-btn" data-lang="en">
      <div class="stg-flag">🇬🇧</div>
      <div class="stg-lang-label">English</div>
    </button>
    <button class="stg-lang-btn" data-lang="de">
      <div class="stg-flag">🇩🇪</div>
      <div class="stg-lang-label">Deutsch</div>
    </button>
  </div>

</div>

<script>{{MAINTENANCE_START_SCRIPT}}</script>
<script>
// ── I18N ──
const I18N = {
  ru: {
    pageTitle: "Технический перерыв",
    mainTitleHTML: "Идёт<br><em>технический</em><br>перерыв",
    maintenanceSubtitle: "Сайт временно недоступен<br>Ведутся технические работы",
    timerLabel: "Перерыв длится уже",
    tHours: "часов",
    tMins: "минут",
    tSecs: "секунд",
    statusHTML: "<strong>В процессе</strong>, страница обновится сама когда всё будет готово",
    whileTitle: "Пока ты ждёшь",
    whileSub: "Интересный факт чтобы не скучать",
    factNext: "Следующий →",
    visitsCountLabel: "За время перерыва зашли на сайт",
    visitsCountUnit: "человек",
    sTheme: "Тема",
    tLight: "☀️ Светлая",
    tDark: "🌙 Тёмная",
    sLang: "Язык"
  },
  en: {
    pageTitle: "Maintenance Break",
    mainTitleHTML: "Technical<br><em>maintenance</em><br>in progress",
    maintenanceSubtitle: "Site temporarily unavailable<br>Maintenance is ongoing",
    timerLabel: "Break has been going on for",
    tHours: "hours",
    tMins: "minutes",
    tSecs: "seconds",
    statusHTML: "<strong>In progress</strong>, the page will refresh automatically when ready",
    whileTitle: "While you wait",
    whileSub: "Interesting fact to pass the time",
    factNext: "Next →",
    visitsCountLabel: "Visitors during the break",
    visitsCountUnit: "people",
    sTheme: "Theme",
    tLight: "☀️ Light",
    tDark: "🌙 Dark",
    sLang: "Language"
  },
  de: {
    pageTitle: "Wartungspause",
    mainTitleHTML: "Technische<br><em>Wartung</em><br>läuft",
    maintenanceSubtitle: "Website vorübergehend nicht erreichbar<br>Wartungsarbeiten laufen",
    timerLabel: "Die Pause dauert schon",
    tHours: "Stunden",
    tMins: "Minuten",
    tSecs: "Sekunden",
    statusHTML: "<strong>In Bearbeitung</strong>, die Seite wird automatisch aktualisiert, wenn sie bereit ist",
    whileTitle: "Während du wartest",
    whileSub: "Interessanter Fakt zum Zeitvertreib",
    factNext: "Nächster →",
    visitsCountLabel: "Besucher während der Pause",
    visitsCountUnit: "Personen",
    sTheme: "Thema",
    tLight: "☀️ Hell",
    tDark: "🌙 Dunkel",
    sLang: "Sprache"
  }
};

let currentLang = (typeof localStorage !== 'undefined' && localStorage.getItem('memories_lang')) || 'ru';
if (!I18N[currentLang]) currentLang = 'ru';

function updateLangUI() {
  const t = I18N[currentLang];
  if (!t) return;
  document.title = t.pageTitle || t.pageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if (t[key]) el.innerHTML = t[key];
  });
  document.querySelectorAll('.stg-lang-btn').forEach(btn => {
    if (btn.getAttribute('data-lang') === currentLang) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

document.querySelectorAll('.stg-lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.getAttribute('data-lang');
    if (typeof localStorage !== 'undefined') localStorage.setItem('memories_lang', currentLang);
    updateLangUI();
  });
});

function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.classList.remove('theme-dark');
    document.documentElement.classList.add('theme-light');
  } else {
    document.documentElement.classList.remove('theme-light');
    document.documentElement.classList.add('theme-dark');
  }
  document.querySelectorAll('.theme-switcher .stg-pill').forEach(b => {
    if(b.getAttribute('data-theme') === theme) {
      b.classList.add('active');
    } else {
      b.classList.remove('active');
    }
  });
  if (typeof localStorage !== 'undefined') localStorage.setItem('memories_theme', theme);
}

document.querySelectorAll('.theme-switcher .stg-pill').forEach(b => {
  b.addEventListener('click', () => {
    applyTheme(b.getAttribute('data-theme'));
  });
});

let initTheme = (typeof localStorage !== 'undefined' && localStorage.getItem('memories_theme')) || 'dark';

const MAINTENANCE_START = typeof window.MAINTENANCE_START_MS === 'number' ? window.MAINTENANCE_START_MS : (Date.now() - 60 * 1000);

function pad(n) { return String(n).padStart(2, '0'); }

function updateTimer() {
  const elapsed = Math.floor((Date.now() - MAINTENANCE_START) / 1000);
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  document.getElementById('t-hours').textContent = pad(h);
  document.getElementById('t-mins').textContent = pad(m);
  document.getElementById('t-secs').textContent = pad(s);
}

// Рандомный порядок фактов

const MAX_DOTS = 10;
let currentFact = 0;
const factTextEl = document.getElementById('factText');
const factNumEl = document.getElementById('factNum');
const factDotsEl = document.getElementById('factDots');

function renderDots() {
  factDotsEl.innerHTML = '';
  var n = Math.min(MAX_DOTS, facts.length);
  // Скользящее окно: при фактах > 10 показываем последние 10 (окно сдвигается влево)
  var startFact = (facts.length > MAX_DOTS && currentFact >= MAX_DOTS - 1) ? (currentFact - MAX_DOTS + 1) : 0;
  var activeDot = (facts.length > MAX_DOTS && currentFact >= MAX_DOTS - 1) ? (MAX_DOTS - 1) : Math.min(currentFact, n - 1);
  for (var i = 0; i < n; i++) {
    var dot = document.createElement('div');
    var factIdx = startFact + i;
    var isActive = (i === activeDot);
    dot.className = 'fact-dot' + (isActive ? ' active' : '');
    dot.addEventListener('click', (function(f) { return function() { showFact(f); }; })(factIdx));
    factDotsEl.appendChild(dot);
  }
}

function showFact(idx) {
  currentFact = idx;
  factTextEl.style.animation = 'none';
  void factTextEl.offsetHeight;
  factTextEl.style.animation = '';
  factTextEl.textContent = facts[idx];
  factNumEl.textContent = (idx + 1) + ' / ' + facts.length;
  renderDots();
}

document.getElementById('factNext').addEventListener('click', () => {
  showFact((currentFact + 1) % facts.length);
});

// Автосмена каждые 8 секунд
setInterval(() => {
  showFact((currentFact + 1) % facts.length);
}, 8000);

showFact(0);


// ── WebSocket: автообновление при смене режима (вкл/выкл техперерыв) ──
(function() {
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var url = proto + '//' + location.host + '/ws/maintenance';
  var ws = new WebSocket(url);
  ws.onmessage = function(ev) {
    try {
      var d = JSON.parse(ev.data);
      if (!d) return;
      if (d.reload || d.maintenance) {
        // При любом сигнале от сервера просто перезагружаем страницу,
        // чтобы она показала актуальное состояние (продакшн или техперерыв).
        location.reload();
      }
    } catch (e) {}
  };
  ws.onclose = function() { /* переподключение не делаем — при перезагрузке страница закроется */ };
})();
