<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>История пары — SureMemory</title>
<meta name="description" content="История вашей пары: воспоминания, события, желания и статистика">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Theme: same init as stats.html -->
<script>
(function(){
  var theme = typeof localStorage !== 'undefined' && localStorage.getItem('memories_theme');
  if (!theme && typeof window.matchMedia === 'function')
    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark');

  var design = typeof localStorage !== 'undefined' && localStorage.getItem('memories_design') || 'standard';
  document.documentElement.classList.add(design === 'bright' ? 'design-bright' : 'design-standard');
  document.documentElement.dataset.design = design;
})();
</script>
<!-- Server injects the export token here — JS never needs to parse the URL -->
<script>window.__exportToken = '__EXPORT_TOKEN_PLACEHOLDER__';</script>

<style>
/* ── Colour tokens — exact copy of stats.html :root ── */
:root, html.theme-light {
  --bg:          #fdf6f9;
  --surface:     #ffffff;
  --accent:      #d43f8d;
  --accent2:     #7c3aed;
  --accent3:     #4158d0;
  --pink-soft:   #fff0f7;
  --pink-border: #fce4f2;
  --text:        #1a1a2e;
  --muted:       #9b7fa8;
  --meta:        #c4a8cc;
}
html.theme-dark {
  --bg:          #0d0b14;
  --surface:     #18152a;
  --text:        #f0ecff;
  --muted:       #a090b8;
  --meta:        #6a5880;
  --pink-soft:   rgba(212,63,141,0.12);
  --pink-border: rgba(212,63,141,0.18);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Фоновые глоу-пятна (mirrors stats.html body::before/::after) */
body::before {
  content: '';
  position: fixed;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(212,63,141,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -150px; left: -150px;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(65,88,208,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.page {
  max-width: 540px;
  margin: 0 auto;
  padding: 14px 16px 80px;
  position: relative;
  z-index: 1;
}

/* ── Sticky header ── */
.sticky-header {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 10px 0 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(253,246,249,0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--pink-border);
  margin: 0 -16px;
  padding-left: 16px;
  padding-right: 16px;
}
html.theme-dark .sticky-header {
  background: rgba(13,11,20,0.82);
}
.sticky-header-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--pink-soft);
  border: 1px solid var(--pink-border);
  color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s, background 0.15s;
  text-decoration: none;
}
/* back-btn hover moved to @media (hover: hover) */

/* ── Cover — title-page aesthetic, distinct from /main ── */
.cover {
  padding: 52px 0 48px;
  text-align: center;
  position: relative;
  /* Subtle dot-grid: gives the "journal paper" feel */
  background-image: radial-gradient(circle, rgba(212,63,141,0.14) 1px, transparent 1px);
  background-size: 22px 22px;
  background-position: center center;
  border-radius: 24px;
  border: 1px solid var(--pink-border);
  margin-bottom: 16px;
  overflow: hidden;
}
html.theme-dark .cover {
  background-image: radial-gradient(circle, rgba(212,63,141,0.09) 1px, transparent 1px);
  border-color: rgba(212,63,141,0.18);
}


/* Eyebrow: "— ИСТОРИЯ ПАРЫ —" */
.cover-eyebrow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 30px;
  position: relative;
  z-index: 1;
}
.cover-eyebrow-text {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--meta);
}
.cover-eyebrow-line {
  display: inline-block;
  width: 28px;
  height: 1px;
  background: var(--meta);
  opacity: 0.6;
}

/* Name lines — large, serif, the "title" of the book */
.cover-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.4rem, 10vw, 3.2rem);
  font-weight: 900;
  color: var(--text);
  line-height: 1.05;
  letter-spacing: -0.025em;
  position: relative;
  z-index: 1;
}

/* Ampersand */
.cover-amp {
  display: block;
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-style: italic;
  font-weight: 700;
  background: linear-gradient(135deg, #d43f8d, #7c3aed);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 8px 0;
  position: relative;
  z-index: 1;
}

/* Ornamental rule */
.cover-ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  margin: 22px auto 20px;
  position: relative;
  z-index: 1;
}
.cover-ornament-line {
  width: 44px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink-border), transparent);
  flex-shrink: 0;
}
html.theme-dark .cover-ornament-line {
  background: linear-gradient(90deg, transparent, rgba(212,63,141,0.35), transparent);
}

/* "с [date]" — meeting date */
.cover-since {
  font-size: 0.88rem;
  color: var(--muted);
  margin-bottom: 5px;
  position: relative;
  z-index: 1;
}
.cover-since strong {
  font-weight: 600;
  color: var(--text);
}

/* "[N] дней вместе" — italic serif, accent */
.cover-days {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-style: italic;
  color: var(--accent);
  position: relative;
  z-index: 1;
  margin-bottom: 20px;
}

/* Memory count badge — shows total right on the cover */
.cover-count-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: linear-gradient(135deg, rgba(212,63,141,0.1), rgba(124,58,237,0.08));
  border: 1px solid var(--pink-border);
  border-radius: 999px;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--accent);
  position: relative;
  z-index: 1;
  margin-bottom: 18px;
}
html.theme-dark .cover-count-badge {
  background: linear-gradient(135deg, rgba(212,63,141,0.14), rgba(124,58,237,0.12));
}

/* Colophon line — "сформировано [date]" */
.cover-colophon {
  font-size: 0.63rem;
  color: var(--meta);
  letter-spacing: 0.07em;
  position: relative;
  z-index: 1;
  opacity: 0.8;
}

/* ── "Содержание" label above counter-wrap ── */
.toc-label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.toc-label-text {
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--muted);
  white-space: nowrap;
}
.toc-label-line {
  flex: 1;
  height: 1px;
  background: var(--pink-border);
}

/* ── Chapter opener (section headers) ── */
.chapter-opener {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 32px 0 14px;
}
.chapter-num {
  font-family: 'Playfair Display', serif;
  font-size: 0.85rem;
  font-style: italic;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.chapter-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}
.chapter-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--pink-border), transparent);
}

/* ── Counter-wrap (mirrors stats.html .counter-wrap) ── */
.counter-wrap {
  background: linear-gradient(135deg, #d43f8d 0%, #7c3aed 60%, #4158d0 100%);
  border-radius: 28px;
  padding: 28px 24px;
  text-align: center;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.counter-wrap::before {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 180px; height: 180px;
  background: rgba(255,255,255,0.07);
  border-radius: 50%;
}
.counter-wrap::after {
  content: '';
  position: absolute;
  bottom: -60px; left: -30px;
  width: 150px; height: 150px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
}
.counter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  position: relative;
}
.counter-col {
  padding: 0 6px;
  border-right: 1px solid rgba(255,255,255,0.15);
}
.counter-col:last-child { border-right: none; }
.counter-num {
  font-family: 'Playfair Display', serif;
  font-size: 2.6rem;
  font-weight: 900;
  color: #fff;
  line-height: 1;
  margin-bottom: 6px;
}
.counter-label {
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: rgba(255,255,255,0.8);
  word-break: break-word;
  line-height: 1.3;
}
.counter-days {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.15);
  font-size: 0.95rem;
  color: rgba(255,255,255,0.85);
  position: relative;
}
.counter-days strong {
  font-weight: 700;
  color: #fff;
}

/* ── Mini-card grid (mirrors stats.html .mini-grid) ── */
.mini-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.mini-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 20px 16px;
  border: 1.5px solid var(--pink-border);
  position: relative;
  overflow: hidden;
}
.mini-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  border-radius: 20px 20px 0 0;
}
.mini-card.mc1::before { background: linear-gradient(90deg, #ff9fd4, #d43f8d); }
.mini-card.mc2::before { background: linear-gradient(90deg, #ffb347, #ff6b35); }
.mini-card.mc3::before { background: linear-gradient(90deg, #7c3aed, #4158d0); }
.mini-card.mc4::before { background: linear-gradient(90deg, #16a34a, #0d9488); }
.mini-card.mc5::before { background: linear-gradient(90deg, #db2777, #be185d); }
.mini-card.mc6::before { background: linear-gradient(90deg, #f59e0b, #d97706); }
.mini-card-icon { font-size: 1.6rem; margin-bottom: 8px; display: block; }
.mini-card-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 4px;
}
.mini-card-label {
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: 500;
}

/* ── Section title ("Популярные категории" и др.) ── */
.section-title {
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--muted);
  margin-bottom: 12px;
  margin-top: 24px;
}

/* ── Cat bar (activity / category breakdown) ── */
.cat-bar-card {
  background: var(--surface);
  border-radius: 24px;
  padding: 22px 20px;
  border: 1.5px solid var(--pink-border);
  margin-bottom: 14px;
}
.cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--pink-border);
}
.cat-row:last-child { border-bottom: none; padding-bottom: 0; }
.cat-row:first-child { padding-top: 0; }
.cat-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  min-width: 80px;
  flex-shrink: 0;
}
.cat-bar-bg {
  flex: 1;
  height: 7px;
  background: var(--pink-soft);
  border-radius: 999px;
  overflow: hidden;
}
.cat-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #ff9fd4, #d43f8d);
  transition: width 0.8s cubic-bezier(.22,1,.36,1);
}
.cat-bar-fill.cf-orange { background: linear-gradient(90deg, #ffb347, #ff6b35); }
.cat-bar-fill.cf-violet { background: linear-gradient(90deg, #7c3aed, #4158d0); }
.cat-bar-fill.cf-green  { background: linear-gradient(90deg, #16a34a, #0d9488); }
.cat-bar-fill.cf-rose   { background: linear-gradient(90deg, #db2777, #be185d); }
.cat-cnt {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--accent);
  width: 32px;
  text-align: right;
  flex-shrink: 0;
}

/* ── Memory card ── */
.memory-card {
  background: var(--surface);
  border-radius: 22px;
  padding: 20px 18px 18px 24px;
  border: 1.5px solid var(--pink-border);
  margin-bottom: 14px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
/* hover moved to @media (hover: hover) below */
.memory-card-stripe {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  border-radius: 5px 0 0 5px;
}
.stripe-pink   { background: linear-gradient(180deg, #ff9fd4, #d43f8d); }
.stripe-orange { background: linear-gradient(180deg, #ffb347, #ff6b35); }
.stripe-violet { background: linear-gradient(180deg, #7c3aed, #4158d0); }
.stripe-green  { background: linear-gradient(180deg, #16a34a, #0d9488); }
.stripe-rose   { background: linear-gradient(180deg, #db2777, #be185d); }
.stripe-amber  { background: linear-gradient(180deg, #f59e0b, #d97706); }

.memory-card-body { flex: 1; min-width: 0; }

.memory-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.memory-cat-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  flex-shrink: 0;
}
.cat-memories        { background: #fce7f3; color: #9d174d; }
.cat-important_moments { background: #fef3c7; color: #92400e; }
.cat-important_dates  { background: #ede9fe; color: #5b21b6; }
.cat-events           { background: #fce7f3; color: #9d174d; }
.cat-wishes           { background: #d1fae5; color: #065f46; }
.cat-default          { background: #f3f0ff; color: #5b21b6; }

.memory-date {
  font-size: 0.78rem;
  color: var(--meta);
  white-space: nowrap;
  flex-shrink: 0;
  padding-top: 3px;
}

.memory-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 6px;
  word-break: break-word;
}
.memory-meta {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 8px;
}
.memory-text {
  font-size: 0.95rem;
  color: var(--text);
  line-height: 1.65;
  word-break: break-word;
}
.memory-text.collapsed {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.toggle-text {
  display: inline-block;
  margin-top: 6px;
  font-size: 0.82rem;
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}

/* ── Media preview inside card ── */
.memory-media {
  margin-top: 10px;
}
.media-photo {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 12px;
  display: block;
}
.media-video-wrap {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  max-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.media-video-thumb {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  opacity: 0.85;
  display: block;
}
.media-play-btn {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.92);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}
.media-play-btn svg { color: #d43f8d; }
.media-duration {
  position: absolute;
  bottom: 7px; right: 9px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 6px;
}
.media-file-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  background: var(--pink-soft);
  border: 1px solid var(--pink-border);
  border-radius: 10px;
  font-size: 0.8rem;
  color: var(--text);
}
.media-file-icon {
  font-size: 1.2rem;
  flex-shrink: 0;
}
.media-file-name {
  flex: 1;
  font-weight: 500;
  word-break: break-all;
}
.media-file-size {
  font-size: 0.7rem;
  color: var(--muted);
  flex-shrink: 0;
}

/* ── Year heading ── */
.year-heading {
  font-family: 'Playfair Display', serif;
  font-size: 1.7rem;
  font-weight: 900;
  color: var(--accent);
  margin-top: 28px;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.month-heading {
  font-size: 0.88rem;
  font-style: italic;
  color: var(--muted);
  margin-top: 16px;
  margin-bottom: 8px;
  font-weight: 500;
}

/* ── Section divider ── */
.section-divider {
  height: 1px;
  background: var(--pink-border);
  margin: 22px 0 14px;
}

/* ── Action buttons ── */
.action-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  background: linear-gradient(135deg, #d43f8d, #7c3aed);
  color: #fff;
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 5px 18px rgba(212,63,141,0.3);
  text-decoration: none;
}
/* btn-primary hover moved to @media (hover: hover) */
.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  background: var(--surface);
  color: var(--accent);
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 600;
  border: 1.5px solid var(--pink-border);
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  text-decoration: none;
}
/* btn-secondary hover moved to @media (hover: hover) */
.btn-loading { opacity: 0.7; pointer-events: none; }

/* ── Scroll reveal (mirrors main.html .observe-fade) ── */
.observe-fade {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.48s ease, transform 0.48s ease;
}
.observe-fade.visible {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .observe-fade { opacity: 1; transform: none; transition: none; }
}

/* ── Enter animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
.cover         { animation: fadeUp 0.55s ease both; }
.toc-label     { animation: fadeUp 0.5s 0.06s ease both; }
.counter-wrap  { animation: fadeUp 0.5s 0.1s  ease both; }
.mini-grid     { animation: fadeUp 0.5s 0.16s ease both; }

/* ── Loading / error states ── */
.state-loading, .state-error {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.state-error { color: var(--accent); }
.spinner {
  display: inline-block;
  width: 32px; height: 32px;
  border: 3px solid var(--pink-border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Empty state ── */
.empty-note {
  text-align: center;
  font-size: 0.88rem;
  color: var(--meta);
  font-style: italic;
  padding: 18px 0;
}

/* ── Footer ── */
.export-footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--pink-border);
  color: var(--meta);
  font-size: 0.75rem;
}
.export-footer a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

html.theme-dark .cat-memories         { background: rgba(212,63,141,0.15); color: #f090c0; }
html.theme-dark .cat-important_moments { background: rgba(251,191,36,0.15); color: #fbbf24; }
html.theme-dark .cat-important_dates   { background: rgba(124,58,237,0.15); color: #c4b5fd; }

html.theme-dark .memory-card { border-color: rgba(212,63,141,0.18); }
html.theme-dark .mini-card   { border-color: rgba(212,63,141,0.18); }

/* ════════════════════════════════════════════════════════════════
   MOBILE AUDIT FIXES — audit against /main, /profile, /stats
   ════════════════════════════════════════════════════════════════ */

/* ── 1. iOS tap highlight — убираем серую вспышку при тапе ── */
.back-btn, .btn-primary, .btn-secondary,
.toggle-text, .memory-card {
  -webkit-tap-highlight-color: transparent;
}

/* ── 2. Touch targets — минимум 44×44 (iOS HIG / WCAG 2.5.5) ── */
.back-btn {
  width: 44px;
  height: 44px;
}

/* Кнопка "Читать полностью": была padding: 0 — не тапабельна */
.toggle-text {
  padding: 6px 0;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
}

/* ── 3. Cover — горизонтальный padding (был 0, текст упирался в скруглённые углы) ── */
.cover {
  padding: 44px 20px 40px;
}

/* Ватермарк — масштабируем вместе с экраном */
.cover-watermark {
  font-size: clamp(8rem, 40vw, 16rem);
}

/* ── 4. Safe-area — iPhone с подбородком (home indicator) ── */
.page {
  padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
}

/* ── 5. Hover только там где есть мышь — убираем залипание на тач ── */
@media (hover: hover) {
  .memory-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(212,63,141,0.1);
  }
  .back-btn:hover    { transform: scale(1.08); background: var(--pink-border); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,63,141,0.4); }
  .btn-secondary:hover { background: var(--pink-soft); transform: translateY(-1px); }
}

/* Active-состояние вместо hover на тач-устройствах */
@media (hover: none) {
  .memory-card:active { opacity: 0.92; transform: scale(0.995); }
  .back-btn:active    { background: var(--pink-border); }
  .btn-primary:active  { opacity: 0.88; }
  .btn-secondary:active { background: var(--pink-soft); }
}

/* Убираем hover-transition у карточек на тач (был transition: transform 0.2s) */
@media (hover: none) {
  .memory-card { transition: opacity 0.15s, transform 0.15s; }
}

/* ── 6. Memory card top — flex-wrap чтобы дата не вылезала ── */
.memory-card-top {
  flex-wrap: wrap;
  row-gap: 4px;
}
/* Дата: разрешаем перенос, была white-space: nowrap */
.memory-date {
  white-space: normal;
  word-break: keep-all;
}

/* ── 7. Counter — fluid на узких экранах ── */
.counter-label {
  font-size: clamp(0.72rem, 2.2vw, 0.82rem);
  word-break: break-word;
  line-height: 1.3;
}
.counter-num {
  font-size: clamp(2rem, 7vw, 2.6rem);
}
.counter-wrap {
  padding: clamp(18px, 4vw, 28px) clamp(14px, 4vw, 24px);
}

/* ── 8. Mini-cards — минимальная высота чтобы не ломалась пустая карточка ── */
.mini-card {
  min-height: 88px;
}

/* ── 9. Cat bar — pill + bar + count на узких экранах ── */
.cat-pill {
  min-width: 80px; /* было 96px */
}

/* ── 10. Медиа — video wrap без ширины мог не занять 100% ── */
.media-video-wrap {
  width: 100%;
  min-height: 100px; /* если thumbnail не загрузился */
}
/* Aspect-ratio для видео — вместо fixed max-height */
@supports (aspect-ratio: 16/9) {
  .media-video-wrap {
    aspect-ratio: 16 / 9;
    max-height: none;
  }
  .media-video-thumb {
    max-height: none;
    height: 100%;
    object-fit: cover;
  }
}

/* ── 11. Производительность — тяжёлые эффекты ── */

/* Backdrop-filter только если GPU справляется */
@media (prefers-reduced-motion: reduce) {
  .sticky-header {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: var(--bg);
    opacity: 0.98;
  }
  .cover, .toc-label, .counter-wrap, .mini-grid {
    animation: none;
    opacity: 1;
    transform: none;
  }
  .cat-bar-fill { transition: none; }
}

/* Observe-fade: упрощённая анимация для reduce-motion */
@media (prefers-reduced-motion: reduce) {
  .observe-fade {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
}

/* Глоу-пятна body: отключаем на очень слабых/маленьких устройствах */
@media (max-width: 360px) {
  body::before, body::after { display: none; }
}

/* ── 12. Маленькие экраны ≤ 360px (iPhone SE 1gen, бюджетные Android) ── */
@media (max-width: 360px) {
  .page { padding-left: 12px; padding-right: 12px; }

  .cover {
    padding: 32px 14px 28px;
    border-radius: 18px;
  }
  .cover-name { font-size: clamp(1.8rem, 8vw, 2.4rem); }
  .cover-since  { font-size: 0.82rem; }
  .cover-days   { font-size: 0.95rem; }

  /* Счётчик: сжимаем ещё сильнее */
  .counter-wrap { padding: 16px 10px; border-radius: 20px; }
  .counter-num  { font-size: 1.7rem; }

  /* Мини-карточки: компактнее по padding, но текст не ужимаем */
  .mini-grid { gap: 8px; }
  .mini-card { padding: 16px 12px; border-radius: 16px; }
  .mini-card-value { font-size: 1.35rem; }
  .mini-card-icon  { font-size: 1.4rem; margin-bottom: 6px; }
  .mini-card-label { font-size: 0.75rem; }

  /* Карточки воспоминаний */
  .memory-card { padding: 16px 14px 14px 20px; border-radius: 18px; }
  .memory-title { font-size: 1rem; }
  .memory-text  { font-size: 0.9rem; }

  /* Категорийные строки — стекаем на очень узких */
  .cat-row { flex-wrap: wrap; gap: 4px; }
  .cat-pill { min-width: 0; }
  .cat-bar-bg { order: 3; flex-basis: 100%; }
  .cat-cnt { order: 2; }

  /* Заголовки глав */
  .chapter-title { font-size: 1rem; }
  .year-heading  { font-size: 1.2rem; }
}

/* ── 13. Стандартный мобильный ≤ 480px (mirrors /main media queries) ── */
@media (max-width: 480px) {
  /* Имена на обложке чуть меньше */
  .cover-name { font-size: clamp(2rem, 9.5vw, 3rem); }

  /* Chapter opener: меньше отступы */
  .chapter-opener { margin: 20px 0 8px; gap: 8px; }
  .chapter-title  { font-size: 1.05rem; }

  /* Year heading */
  .year-heading { font-size: 1.35rem; margin-top: 18px; }

  /* Карточки воспоминаний: чуть компактнее на стандартном телефоне */
  .memory-card { margin-bottom: 8px; }

  /* Фото: чуть ниже на телефоне чтобы не занимало весь экран */
  .media-photo { max-height: 260px; }

  /* Кнопки: полная ширина на мобильном */
  .action-row { flex-direction: column; }
  .action-row .btn-primary,
  .action-row .btn-secondary {
    width: 100%;
    justify-content: center;
  }

  /* Футер */
  .export-footer { padding-bottom: env(safe-area-inset-bottom, 0px); }
}

/* ── 14. Длинные истории — оптимизация рендеринга ── */
/* contain: layout на секциях — браузер не перерисовывает весь поток */
#memoriesSection, #eventsSection, #wishesSection {
  contain: layout;
}

/* Lazy-рендеринг: изображения уже имеют loading="lazy" в JS.
   Дополнительно ускоряем Paint на long-scroll через content-visibility */
@supports (content-visibility: auto) {
  .memory-card {
    content-visibility: auto;
    contain-intrinsic-size: auto 120px; /* примерная высота */
  }
}
</style>

<script>
(function () {
'use strict';

// Primary: token injected server-side (reliable, no URL parsing needed)
// Fallback: extract from URL path (works after F5 if placeholder not replaced)
var coupleToken = (window.__exportToken && window.__exportToken !== '__EXPORT_TOKEN_PLACEHOLDER__')
  ? window.__exportToken
  : (function() {
      var parts = window.location.pathname.split('/').filter(Boolean);
      return parts[parts.length - 1] || '';
    })();

var CAT_LABELS = {
  important_moments: 'важный момент',
  memories:          'воспоминание',
  important_dates:   'важная дата',
  events:            'событие',
  wishes:            'желание',
  default:           'запись',
};

var CAT_STRIPE = {
  important_moments: 'stripe-orange',
  memories:          'stripe-pink',
  important_dates:   'stripe-violet',
  events:            'stripe-rose',
  wishes:            'stripe-green',
  default:           'stripe-amber',
};

var CAT_PILL = {
  important_moments: 'cat-important_moments',
  memories:          'cat-memories',
  important_dates:   'cat-important_dates',
  events:            'cat-events',
  wishes:            'cat-wishes',
  default:           'cat-default',
};

var CAT_BAR_COLOR = {
  important_moments: 'cf-orange',
  memories:          '',
  important_dates:   'cf-violet',
  events:            'cf-rose',
  wishes:            'cf-green',
  default:           '',
};

function esc(s) {
  var d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

function daysWord(n) {
  n = Math.abs(Math.round(n)) % 100;
  if (n >= 11 && n <= 14) return 'дней';
  n = n % 10;
  if (n === 1) return 'день';
  if (n >= 2 && n <= 4) return 'дня';
  return 'дней';
}

function formatDuration(sec) {
  if (!sec) return '';
  sec = Math.round(sec);
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// ── Setup scroll reveal ────────────────────────────────────────────────────
function setupReveal() {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('.observe-fade').forEach(function(el) {
      el.classList.add('visible');
    });
    return;
  }
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.06, rootMargin: '0px 0px -30px 0px' });

  document.querySelectorAll('.observe-fade').forEach(function(el) {
    io.observe(el);
  });
}

// ── Staggered delay on repeated elements ──────────────────────────────────
function applyStagger(container, selector, base, step) {
  container.querySelectorAll(selector).forEach(function(el, i) {
    el.style.transitionDelay = (base + i * step) + 'ms';
  });
}

// ── Build media preview ───────────────────────────────────────────────────
function buildMedia(item) {
  var mt = (item.media_type || '').toLowerCase();
  var mp = item.media_path || '';
  var ms = item.media_size || 0;
  var mf = item.media_filename || '';
  var dur = item.media_duration || 0;

  if (!mt) return null;

  var wrap = document.createElement('div');
  wrap.className = 'memory-media';

  if (mt === 'photo') {
    var img = document.createElement('img');
    img.className = 'media-photo';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = '';
    img.src = mp ? '/media/' + mp.replace(/^\/media\//, '').replace(/^media\//, '') : '';
    if (!img.src || img.src === '/media/') return null;
    wrap.appendChild(img);

  } else if (mt === 'video' || mt === 'video_note') {
    var vw = document.createElement('div');
    vw.className = 'media-video-wrap';
    if (mp) {
      var thumb = document.createElement('img');
      thumb.className = 'media-video-thumb';
      thumb.loading = 'lazy';
      thumb.alt = '';
      // Use the media path; video thumbnail is usually available as _thumb.jpg
      var thumbSrc = mp.replace(/^\/media\//, '').replace(/^media\//, '');
      var dotIdx = thumbSrc.lastIndexOf('.');
      if (dotIdx >= 0) thumbSrc = thumbSrc.slice(0, dotIdx) + '_thumb.jpg';
      thumb.src = '/media/' + thumbSrc;
      thumb.onerror = function() { this.style.display = 'none'; };
      vw.appendChild(thumb);
    }
    var playBtn = document.createElement('div');
    playBtn.className = 'media-play-btn';
    playBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
    vw.appendChild(playBtn);
    if (dur) {
      var durEl = document.createElement('div');
      durEl.className = 'media-duration';
      durEl.textContent = formatDuration(dur);
      vw.appendChild(durEl);
    }
    wrap.appendChild(vw);

  } else if (mt === 'voice' || mt === 'audio') {
    var row = document.createElement('div');
    row.className = 'media-file-row';
    row.innerHTML = '<span class="media-file-icon">🎙</span>' +
      '<span class="media-file-name">' + esc(mf || 'Голосовое сообщение') + '</span>' +
      (dur ? '<span class="media-file-size">' + esc(formatDuration(dur)) + '</span>' : '');
    wrap.appendChild(row);

  } else if (mt === 'document') {
    var row2 = document.createElement('div');
    row2.className = 'media-file-row';
    var sizeStr = ms ? (ms > 1048576 ? (ms / 1048576).toFixed(1) + ' МБ' : Math.round(ms / 1024) + ' КБ') : '';
    row2.innerHTML = '<span class="media-file-icon">📎</span>' +
      '<span class="media-file-name">' + esc(mf || 'Файл') + '</span>' +
      (sizeStr ? '<span class="media-file-size">' + esc(sizeStr) + '</span>' : '');
    wrap.appendChild(row2);

  } else {
    return null;
  }

  return wrap;
}

// ── Build one memory card ─────────────────────────────────────────────────
function buildCard(item) {
  var cat = item.category || 'default';

  var card = document.createElement('div');
  card.className = 'memory-card observe-fade';

  var stripe = document.createElement('div');
  stripe.className = 'memory-card-stripe ' + (CAT_STRIPE[cat] || 'stripe-amber');
  card.appendChild(stripe);

  var body = document.createElement('div');
  body.className = 'memory-card-body';

  // Top row: category pill + date
  var top = document.createElement('div');
  top.className = 'memory-card-top';
  var pill = document.createElement('span');
  pill.className = 'memory-cat-pill ' + (CAT_PILL[cat] || 'cat-default');
  pill.textContent = CAT_LABELS[cat] || 'запись';
  var dateEl = document.createElement('span');
  dateEl.className = 'memory-date';
  dateEl.textContent = item.date || '';
  top.appendChild(pill);
  top.appendChild(dateEl);
  body.appendChild(top);

  // Title
  if (item.title) {
    var titleEl = document.createElement('div');
    titleEl.className = 'memory-title';
    titleEl.textContent = item.title;
    body.appendChild(titleEl);
  }

  // Author meta
  if (item.author) {
    var metaEl = document.createElement('div');
    metaEl.className = 'memory-meta';
    metaEl.textContent = item.author;
    body.appendChild(metaEl);
  }

  // Body text with collapse
  if (item.text) {
    var textEl = document.createElement('div');
    textEl.className = 'memory-text';
    textEl.textContent = item.text;
    if (item.text.length > 320) {
      textEl.classList.add('collapsed');
      var toggle = document.createElement('button');
      toggle.className = 'toggle-text';
      toggle.textContent = 'Читать полностью';
      toggle.onclick = function() {
        var collapsed = textEl.classList.toggle('collapsed');
        toggle.textContent = collapsed ? 'Читать полностью' : 'Свернуть';
      };
      body.appendChild(textEl);
      body.appendChild(toggle);
    } else {
      body.appendChild(textEl);
    }
  }

  // Media
  var mediaEl = buildMedia(item);
  if (mediaEl) body.appendChild(mediaEl);

  card.appendChild(body);
  return card;
}

// ── Build section (memories / events / wishes) ────────────────────────────
function buildSection(containerId, items, sectionTitle, groupByDate, chapterNum) {
  var container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  if (!items || !items.length) return;

  // Chapter opener — "Глава I  ·  Воспоминания  ──────"
  var opener = document.createElement('div');
  opener.className = 'chapter-opener observe-fade';
  if (chapterNum) {
    var numEl = document.createElement('span');
    numEl.className = 'chapter-num';
    numEl.textContent = chapterNum + ' ·';
    opener.appendChild(numEl);
  }
  var titleEl = document.createElement('span');
  titleEl.className = 'chapter-title';
  titleEl.textContent = sectionTitle;
  opener.appendChild(titleEl);
  var lineEl = document.createElement('span');
  lineEl.className = 'chapter-line';
  opener.appendChild(lineEl);
  container.appendChild(opener);

  if (!groupByDate) {
    items.forEach(function(item) {
      container.appendChild(buildCard(item));
    });
    return;
  }

  // Group by year → month
  var byYear = {};
  var undated = [];
  var MONTHS = ['','январь','февраль','март','апрель','май','июнь',
                'июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  items.forEach(function(item) {
    var iso = item.date_iso || '';
    var m = iso.match(/^(\d{4})-(\d{2})/);
    if (m) {
      var y = m[1], mo = parseInt(m[2], 10);
      if (!byYear[y]) byYear[y] = {};
      if (!byYear[y][mo]) byYear[y][mo] = [];
      byYear[y][mo].push(item);
    } else {
      undated.push(item);
    }
  });

  Object.keys(byYear).sort().forEach(function(year) {
    var yh = document.createElement('div');
    yh.className = 'year-heading observe-fade';
    yh.textContent = year;
    container.appendChild(yh);

    Object.keys(byYear[year]).sort(function(a,b){return +a - +b;}).forEach(function(mo) {
      var mh = document.createElement('div');
      mh.className = 'month-heading observe-fade';
      mh.textContent = MONTHS[+mo] || '';
      container.appendChild(mh);
      byYear[year][mo].forEach(function(item) {
        container.appendChild(buildCard(item));
      });
    });
  });

  if (undated.length) {
    var uh = document.createElement('div');
    uh.className = 'month-heading observe-fade';
    uh.textContent = 'Разное';
    container.appendChild(uh);
    undated.forEach(function(item) {
      container.appendChild(buildCard(item));
    });
  }
}

// ── Build category stats bar ──────────────────────────────────────────────
function buildCatSection(allItems) {
  var container = document.getElementById('catSection');
  if (!container) return;
  var counts = {};
  allItems.forEach(function(item) {
    var cat = item.category || 'default';
    counts[cat] = (counts[cat] || 0) + 1;
  });
  var total = Object.values(counts).reduce(function(a,b){return a+b;}, 0) || 1;
  var sorted = Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,5);
  if (!sorted.length) return;

  var divider = document.createElement('div');
  divider.className = 'section-divider observe-fade';
  container.appendChild(divider);

  var title = document.createElement('div');
  title.className = 'section-title observe-fade';
  title.textContent = 'Популярные категории';
  container.appendChild(title);

  var card = document.createElement('div');
  card.className = 'cat-bar-card observe-fade';

  sorted.forEach(function(cat) {
    var cnt = counts[cat];
    var pct = Math.round(cnt / total * 100);
    var row = document.createElement('div');
    row.className = 'cat-row';
    var pill = document.createElement('span');
    pill.className = 'memory-cat-pill ' + (CAT_PILL[cat] || 'cat-default');
    pill.style.minWidth = '96px';
    pill.textContent = CAT_LABELS[cat] || cat;
    var bg = document.createElement('div');
    bg.className = 'cat-bar-bg';
    var fill = document.createElement('div');
    fill.className = 'cat-bar-fill ' + (CAT_BAR_COLOR[cat] || '');
    fill.style.width = '0%';
    // Animate after mount
    setTimeout(function() { fill.style.width = pct + '%'; }, 200);
    bg.appendChild(fill);
    var cntEl = document.createElement('div');
    cntEl.className = 'cat-cnt';
    cntEl.textContent = cnt;
    row.appendChild(pill);
    row.appendChild(bg);
    row.appendChild(cntEl);
    card.appendChild(row);
  });

  container.appendChild(card);
}

// ── Render full page from data ────────────────────────────────────────────
function render(data) {
  // Build custom category label map for the UI
  if (data.custom_categories && data.custom_categories.length) {
    data.custom_categories.forEach(function(cc) {
      var key = 'custom_' + cc.id;
      var emoji = cc.emoji || '';
      CAT_LABELS[key] = emoji ? emoji + ' ' + (cc.name || key) : (cc.name || key);
    });
  }

  var names = data.couple_names || ['—', '—'];
  document.getElementById('heroName1').textContent = names[0] || '—';
  document.getElementById('heroName2').textContent = names[1] || '—';
  document.title = (names[0] || '') + ' & ' + (names[1] || '') + ' — История пары';
  document.getElementById('stickyTitle').textContent = (names[0] || '') + ' & ' + (names[1] || '');

  // Cover: meeting date
  var sinceEl = document.getElementById('coverSince');
  if (sinceEl && data.met_date_display) {
    sinceEl.innerHTML = 'вместе с <strong>' + esc(data.met_date_display) + '</strong>';
  }

  // Cover: days together (italic serif accent)
  var daysEl = document.getElementById('coverDays');
  var days = data.days_together;
  if (daysEl && days != null) {
    daysEl.textContent = days + ' ' + daysWord(days) + ' вместе';
  }

  // Cover: memory count badge
  var stats = data.stats || {};
  var totalMem = (stats.memories || 0) + (stats.events || 0) + (stats.wishes || 0);
  var badgeEl = document.getElementById('coverCountBadge');
  var badgeText = document.getElementById('coverCountText');
  if (badgeEl && totalMem > 0) {
    badgeEl.style.display = 'inline-flex';
    badgeText.textContent = totalMem + ' ' + _totalWord(totalMem) + ' в архиве';
  }

  // Cover: colophon
  var colophon = document.getElementById('coverColophon');
  if (colophon && data.export_date) {
    colophon.textContent = 'сформировано ' + data.export_date + ' · SureMemory';
  }

  // Counter wrap (table of contents numbers)
  document.getElementById('cntMemories').textContent = stats.memories || 0;
  document.getElementById('cntEvents').textContent   = stats.events   || 0;
  document.getElementById('cntWishes').textContent   = stats.wishes   || 0;

  // Counter days line
  if (days != null) {
    document.getElementById('counterDays').innerHTML =
      'Вместе <strong>' + days + '</strong> ' + daysWord(days);
  }

  document.getElementById('mcPhotos').textContent = stats.photos || 0;
  document.getElementById('mcVideos').textContent = stats.videos || 0;
  document.getElementById('mcVoices').textContent = stats.voices || 0;
  document.getElementById('mcFiles').textContent  = stats.files  || 0;

  // Footer
  if (data.export_date) {
    document.getElementById('exportDate').textContent = 'Сформировано ' + data.export_date;
  }

  var sections = data.sections || {};
  var allItems = (sections.memories || [])
    .concat(sections.events  || [])
    .concat(sections.wishes  || []);

  buildCatSection(allItems);
  buildSection('memoriesSection', sections.memories || [], 'Воспоминания', true,  'Глава I');
  buildSection('eventsSection',   sections.events   || [], 'События',      false, 'Глава II');
  buildSection('wishesSection',   sections.wishes   || [], 'Желания',      false, 'Глава III');

  document.getElementById('stateLoading').style.display = 'none';
  document.getElementById('mainPage').style.display = '';

  applyStagger(document.getElementById('miniGrid'), '.mini-card', 0, 50);
  setupReveal();
}

function _totalWord(n) {
  n = Math.abs(n) % 100;
  if (n >= 11 && n <= 14) return 'записей';
  n = n % 10;
  if (n === 1) return 'запись';
  if (n >= 2 && n <= 4) return 'записи';
  return 'записей';
}

// ── Show error ─────────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('stateLoading').style.display = 'none';
  var errEl = document.getElementById('stateError');
  errEl.style.display = '';
  document.getElementById('errorMsg').textContent = msg || 'Произошла ошибка';
}

// ── Load data ─────────────────────────────────────────────────────────────
if (!coupleToken || coupleToken.length < 10) {
  showError('Неверная ссылка. Откройте историю через профиль.');
  return;
}

fetch('/api/export_data/' + encodeURIComponent(coupleToken), {
  credentials: 'include',
})
  .then(function(r) {
    if (r.status === 401 || r.status === 403) {
      throw new Error('forbidden');
    }
    if (!r.ok) throw new Error('http_' + r.status);
    return r.json();
  })
  .then(function(data) {
    if (!data.ok) throw new Error(data.error || 'not_ok');
    render(data.data);
  })
  .catch(function(err) {
    if (err.message === 'forbidden') {
      showError('Доступ запрещён. Эта история доступна только участникам пары.');
    } else {
      showError('Не удалось загрузить данные. Попробуйте обновить страницу.');
    }
  });

})();
</script>
