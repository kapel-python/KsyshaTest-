<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottom Navigation</title>
<script>
(function() {
  try {
    var theme = localStorage.getItem('memories_theme');
    if (!theme && typeof window.matchMedia === 'function')
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (theme === 'dark') document.documentElement.classList.add('theme-dark');
    var design = localStorage.getItem('memories_design') || 'bright';
    document.documentElement.classList.add(design === 'bright' ? 'design-bright' : 'design-standard');
  } catch(e) {}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ══ BOTTOM NAVIGATION ══ */
  :root {
    --nav-pink:   #d43f8d;
    --nav-violet: #7c3aed;
    --nav-blue:   #4158d0;
    --nav-muted:  #c4b5d0;
    --nav-grad:   linear-gradient(135deg, #d43f8d 0%, #7c3aed 55%, #4158d0 100%);
    --nav-grad-bg:linear-gradient(135deg, rgba(212,63,141,0.09) 0%, rgba(124,58,237,0.09) 55%, rgba(65,88,208,0.09) 100%);
  }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    font-family: 'Inter', sans-serif;
  }

  .nav-inner {
    margin: 0 28px 12px;
    background: rgba(252, 248, 254, 0.85);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border-radius: 28px;
    border: 1px solid rgba(124, 58, 237, 0.09);
    box-shadow:
      0 6px 28px rgba(124, 58, 237, 0.09),
      0 1px 6px rgba(212, 63, 141, 0.05),
      inset 0 1px 0 rgba(255,255,255,0.75);
    padding: 6px 8px;
    display: flex;
    align-items: center;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 9px 4px 8px;
    border-radius: 22px;
    cursor: pointer;
    position: relative;
    transition: background 0.28s ease, transform 0.18s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .nav-item:active {
    transform: scale(0.93);
  }

  .nav-item.active {
    background: var(--nav-grad-bg);
  }

  .nav-item.active::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: var(--nav-grad);
    opacity: 0.06;
    pointer-events: none;
  }

  .nav-icon {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.28s cubic-bezier(.25,.8,.25,1);
  }

  .nav-item.active .nav-icon {
    transform: translateY(-1px);
  }

  .nav-icon svg {
    width: 20px; height: 20px;
    stroke: var(--nav-muted);
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.28s ease, filter 0.28s ease;
  }

  .nav-item.active .nav-icon svg {
    stroke: var(--nav-violet);
    filter: drop-shadow(0 0 3px rgba(124,58,237,0.30));
  }

  .nav-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--nav-muted);
    letter-spacing: 0.02em;
    transition: color 0.28s ease;
    white-space: nowrap;
  }

  .nav-item.active .nav-label {
    background: var(--nav-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 600;
  }

  @media (hover: hover) {
    .nav-item:not(.active):hover {
      background: rgba(124,58,237,0.05);
    }
    .nav-item:not(.active):hover .nav-icon svg {
      stroke: rgba(124,58,237,0.4);
    }
    .nav-item:not(.active):hover .nav-label {
      color: rgba(124,58,237,0.45);
    }
  }

  /* ══ STANDARD DESIGN ══ */
  html.design-standard .nav-inner {
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(0,0,0,0.07);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,1);
  }
  html.design-standard.theme-dark .nav-inner {
    background: rgba(18,18,18,0.94);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  html.design-standard .nav-item { color: #9ca3af; }
  html.design-standard .nav-item.active {
    background: rgba(94,129,172,0.10);
  }
  html.design-standard .nav-item.active::after {
    background: none; opacity: 0;
  }
  html.design-standard .nav-item.active .nav-icon svg {
    stroke: #5e81ac;
    filter: drop-shadow(0 0 3px rgba(94,129,172,0.30));
  }
  html.design-standard .nav-item.active .nav-label {
    background: none;
    -webkit-background-clip: unset;
    -webkit-text-fill-color: #5e81ac;
    background-clip: unset;
    font-weight: 600;
  }
  html.design-standard .nav-icon svg { stroke: #9ca3af; }
  @media (hover: hover) {
    html.design-standard .nav-item:not(.active):hover { background: rgba(94,129,172,0.07); }
    html.design-standard .nav-item:not(.active):hover .nav-icon svg { stroke: #5e81ac; }
    html.design-standard .nav-item:not(.active):hover .nav-label { color: #5e81ac; }
  }
</style>
</head>
<body>

<!-- ══ BOTTOM NAVIGATION ══ -->
<nav class="bottom-nav" role="navigation" aria-label="Главное меню">
  <div class="nav-inner">

    <div class="nav-item active" data-tab="home" role="button" tabindex="0" aria-label="Главная" aria-current="page">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
      </div>
      <span class="nav-label">Главная</span>
    </div>

    <div class="nav-item" data-tab="stats" role="button" tabindex="0" aria-label="Статистика">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
      </div>
      <span class="nav-label">Статистика</span>
    </div>

    <div class="nav-item" data-tab="profile" role="button" tabindex="0" aria-label="Профиль">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <span class="nav-label">Профиль</span>
    </div>

  </div>
</nav>

<script>
  document.querySelectorAll('.nav-item').forEach(item => {
    const activate = () => {
      document.querySelectorAll('.nav-item').forEach(i => {
        i.classList.remove('active');
        i.removeAttribute('aria-current');
      });
      item.classList.add('active');
      item.setAttribute('aria-current', 'page');
    };
    item.addEventListener('click', activate);
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
    });
  });
</script>

</body>
</html>
