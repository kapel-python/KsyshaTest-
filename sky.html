// Проецирует реальные координаты городов на canvas introAnimation
// Использует простую равноугольную проекцию с padding 15°/10°
function _introGetPoints(W, H) {
  const mCfg = _skyCfg.moscow  || { lat: 0, lon: 0 };
  const bCfg = _skyCfg.bishkek || { lat: 0, lon: 0 };
  const latA = mCfg.lat, lonA = mCfg.lon;
  const latB = bCfg.lat, lonB = bCfg.lon;

  // Если координаты неизвестны (lat=lon=0) — используем фиксированные позиции
  if (latA === 0 && lonA === 0) return { moscow: { x: W * 0.18, y: H * 0.30 }, bishkek: { x: W * 0.82, y: H * 0.70 } };
  if (latB === 0 && lonB === 0) return { moscow: { x: W * 0.18, y: H * 0.30 }, bishkek: { x: W * 0.82, y: H * 0.70 } };

  const padLat = 12, padLon = 18;
  const latMin = Math.min(latA, latB) - padLat;
  const latMax = Math.max(latA, latB) + padLat;
  const lonMin = Math.min(lonA, lonB) - padLon;
  const lonMax = Math.max(lonA, lonB) + padLon;

  function project(lat, lon) {
    const x = ((lon - lonMin) / (lonMax - lonMin)) * W * 0.8 + W * 0.1;
    const y = ((latMax - lat) / (latMax - latMin)) * H * 0.8 + H * 0.1;
    return { x, y };
  }
  return { moscow: project(latA, lonA), bishkek: project(latB, lonB) };
}

// Типирование текста с курсором
function _typeText(el, text, speed) {
  return new Promise(resolve => {
    if (_introAborted) { el.innerHTML = text + '<span class="cursor"></span>'; resolve(); return; }
    let i = 0;
    el.innerHTML = '<span class="cursor"></span>';
    const timer = setInterval(() => {
      if (_introAborted) { clearInterval(timer); el.innerHTML = text + '<span class="cursor"></span>'; resolve(); return; }
      if (i >= text.length) { clearInterval(timer); setTimeout(resolve, 350); return; }
      el.innerHTML = text.slice(0, ++i) + '<span class="cursor"></span>';
    }, speed);
  });
}

// Стирание текста
function _eraseText(el, speed) {
  return new Promise(resolve => {
    if (_introAborted) { el.innerHTML = '<span class="cursor"></span>'; resolve(); return; }
    let text = el.textContent.replace('|','').trim();
    const timer = setInterval(() => {
      if (_introAborted) { clearInterval(timer); el.innerHTML = '<span class="cursor"></span>'; resolve(); return; }
      if (!text.length) {
        el.innerHTML = '<span class="cursor"></span>';
        clearInterval(timer);
        setTimeout(resolve, 200);
        return;
      }
      text = text.slice(0, -1);
      el.innerHTML = text + '<span class="cursor"></span>';
    }, speed);
  });
}

function _delay(ms) {
  return new Promise(r => {
    if (_introAborted) { r(); return; }
    const t = setTimeout(r, ms);
    // Если пропуск случился пока ждём — разрешаем сразу
    const check = setInterval(() => { if (_introAborted) { clearTimeout(t); clearInterval(check); r(); } }, 50);
    setTimeout(() => clearInterval(check), ms + 100);
  });
}

// Плавный bezier для дуги самолёта (t от 0 до 1)
function _quadBezier(p0, p1, p2, t) {
  const mt = 1 - t;
  return {
    x: mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x,
    y: mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y,
  };
}


// ── ЭКГ: рисует пульс сердца вдоль маршрута ─────────────────
async function _drawHeartbeat(canvas, M, B) {
  return new Promise(resolve => {
    // Создаём отдельный overlay-canvas поверх интро, не трогаем canvas маршрута
    const wrap = canvas.parentElement;
    const ov = document.createElement('canvas');
    ov.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:5;';
    ov.width  = canvas.width;
    ov.height = canvas.height;
    wrap.appendChild(ov);
    const ctx = ov.getContext('2d');
    const W = ov.width, H = ov.height;

    // Серединная точка между двумя городами
    const mx = (M.x + B.x) / 2;
    const my = (M.y + B.y) / 2 - H * 0.04; // чуть выше центра

    // Ширина ЭКГ
    const len = Math.min(W * 0.32, 180);

    // ECG точки: плоская → P-зуб → QRS-комплекс → T-зуб → плоская
    function ecgX(t) { return mx - len/2 + t * len; }
    const ecgPts = [
      [0,    0   ],
      [0.18, 0   ],
      [0.24, -0.06],   // P-зуб
      [0.30, 0   ],
      [0.38, -0.05],   // Q
      [0.44, 0.85],    // R (пик вверх)
      [0.50, -0.32],   // S (спуск)
      [0.56, 0   ],
      [0.62, 0.14],    // T-зуб
      [0.70, 0   ],
      [1,    0   ],
    ];
    const amp = Math.min(H * 0.10, 52);

    function getY(t) {
      for (let i = 0; i < ecgPts.length - 1; i++) {
        const [t0, y0] = ecgPts[i], [t1, y1] = ecgPts[i+1];
        if (t >= t0 && t <= t1) {
          const frac = (t - t0) / (t1 - t0);
          // Лёгкое сглаживание
          const s = frac * frac * (3 - 2 * frac);
          return my - (y0 + (y1 - y0) * s) * amp;
        }
      }
      return my;
    }

    const TOTAL_MS = 1800;  // рисование
    const HOLD_MS  = 400;   // пауза на полной линии
    const FADE_MS  = 800;   // затухание
    let start = null;

    function frame(ts) {
      if (_introAborted) { ov.remove(); resolve(); return; }
      if (!start) start = ts;
      const elapsed = ts - start;
      ctx.clearRect(0, 0, W, H);

      let alpha, drawT;
      if (elapsed < TOTAL_MS) {
        drawT = elapsed / TOTAL_MS;
        alpha = Math.min(drawT * 4, 1);
      } else if (elapsed < TOTAL_MS + HOLD_MS) {
        drawT = 1;
        alpha = 1;
      } else {
        drawT = 1;
        alpha = Math.max(0, 1 - (elapsed - TOTAL_MS - HOLD_MS) / FADE_MS);
      }

      ctx.save();
      ctx.globalAlpha = alpha;

      // Основная линия (пройденная часть)
      ctx.shadowColor = '#ff7eb3';
      ctx.shadowBlur  = 18;
      ctx.strokeStyle = '#ffb6d9';
      ctx.lineWidth   = 2;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';

      const steps = 150;
      const maxI  = Math.floor(steps * drawT);
      ctx.beginPath();
      for (let i = 0; i <= maxI; i++) {
        const pt = i / steps;
        const px = ecgX(pt);
        const py = getY(pt);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Бегущая точка
      if (drawT < 1) {
        const hx = ecgX(drawT);
        const hy = getY(drawT);
        ctx.shadowBlur = 26;
        ctx.shadowColor = '#ff4da0';
        ctx.fillStyle   = '#ff6eb4';
        ctx.beginPath();
        ctx.arc(hx, hy, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      if (elapsed < TOTAL_MS + HOLD_MS + FADE_MS) {
        requestAnimationFrame(frame);
      } else {
        ov.remove();
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

async function runIntroAnimation() {
  const intro   = document.getElementById('skyIntro');
  const canvas  = document.getElementById('introCanvas');
  const wrap    = document.getElementById('introMapWrap');
  const typedEl = document.getElementById('introTyped');
  const btn     = document.getElementById('introBtnEnter');

  // Размеры canvas
  canvas.width  = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');

  const isSame = _skyCfg.sameCity === true;

  if (isSame) {
    // Обычное небо (в одном городе)
    const C = { x: W / 2, y: H / 2 };

    window._introSkipToEnd = function() {
      clearInterval(typeof _citytimer !== 'undefined' ? _citytimer : null);
      ctx.clearRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(100,120,200,0.07)'; ctx.lineWidth = 1;
      for (let gi = 0; gi <= 4; gi++) {
        ctx.beginPath(); ctx.moveTo(W*gi/4, 0); ctx.lineTo(W*gi/4, H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, H*gi/4); ctx.lineTo(W, H*gi/4); ctx.stroke();
      }

      const grd = ctx.createRadialGradient(C.x, C.y, 0, C.x, C.y, 22);
      grd.addColorStop(0, 'rgba(200,180,255,0.5)'); grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(C.x, C.y, 22, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(C.x, C.y, 6, 0, Math.PI*2); ctx.fill();

      const lm = document.getElementById('introLabelMoscow');
      const lb = document.getElementById('introLabelBishkek');
      if (lm) { lm.style.left = C.x+'px'; lm.style.top = C.y+'px'; lm.classList.add('visible'); }
      if (lb) { lb.style.display = 'none'; }

      const nm = document.getElementById('introNameMoscow');
      if (nm) nm.textContent = (_skyCfg.moscow || {}).cityLabel || '—';

      typedEl.style.transition = 'none';
      typedEl.style.opacity = '1';
      typedEl.innerHTML = 'Мы под одним небом ✦';
      btn.classList.add('visible');
      window._introSkipToEnd = null;
    };

    await _delay(400);
    await _typeText(typedEl, 'мы под одним небом ❤️', 55);
    await _delay(600);

    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(100,120,200,0.07)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      ctx.beginPath(); ctx.moveTo(W*i/4, 0); ctx.lineTo(W*i/4, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, H*i/4); ctx.lineTo(W, H*i/4); ctx.stroke();
    }

    await new Promise(r => {
      const t0 = performance.now();
      function frame(now) {
        const p = Math.min((now-t0)/500, 1);
        const ease = Math.max(0, 1 - Math.pow(1-p, 3));
        ctx.clearRect(C.x-25, C.y-25, 50, 50);
        const grd = ctx.createRadialGradient(C.x, C.y, 0, C.x, C.y, Math.max(0.001, 18*ease));
        grd.addColorStop(0, 'rgba(200,180,255,0.35)');
        grd.addColorStop(1, 'transparent');
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(C.x, C.y, Math.max(0.001, 18*ease), 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(C.x, C.y, Math.max(0.001, 5*ease), 0, Math.PI*2); ctx.fill();
        if (p < 1) requestAnimationFrame(frame); else r();
      }
      requestAnimationFrame(frame);
    });

    const lm = document.getElementById('introLabelMoscow');
    const lb = document.getElementById('introLabelBishkek');
    if (lm) { lm.style.left = C.x+'px'; lm.style.top = C.y+'px'; lm.classList.add('visible'); }
    if (lb) { lb.style.display = 'none'; }

    const nm = document.getElementById('introNameMoscow');
    if (nm) nm.textContent = (_skyCfg.moscow || {}).cityLabel || '—';

    await _delay(500);
    await _eraseText(typedEl, 28);
    await _typeText(typedEl, 'Мы ближе когда мы вместе ✦', 50);
    await _delay(600);
    btn.classList.add('visible');
    return;
  }

  const pts = _introGetPoints(W, H);
  const M   = pts.moscow, B = pts.bishkek;

  // Вычисляем ctrl заранее — нужен для пропуска анимации в любой момент
  const ctrl = { x: (M.x + B.x)/2, y: Math.min(M.y, B.y) - H * 0.28 };

  // Регистрируем функцию пропуска СРАЗУ — до любого await
  // Она доступна с первого же кадра анимации
  window._introSkipToEnd = function() {
    clearInterval(typeof _citytimer !== 'undefined' ? _citytimer : null);
    document.querySelectorAll('.intro-plane').forEach(el => el.remove());
    const introWr = document.getElementById('introMapWrap');
    if (introWr) introWr.querySelectorAll('canvas:not(#introCanvas)').forEach(el => el.remove());

    ctx.clearRect(0, 0, W, H);

    // Сетка
    ctx.strokeStyle = 'rgba(100,120,200,0.07)';
    ctx.lineWidth = 1;
    for (let gi = 0; gi <= 4; gi++) {
      ctx.beginPath(); ctx.moveTo(W*gi/4, 0); ctx.lineTo(W*gi/4, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, H*gi/4); ctx.lineTo(W, H*gi/4); ctx.stroke();
    }

    // Дуга — толстая, сплошная, яркая
    ctx.save();
    const lg = ctx.createLinearGradient(M.x, M.y, B.x, B.y);
    lg.addColorStop(0, 'rgba(200,180,255,1)');
    lg.addColorStop(1, 'rgba(255,200,150,1)');
    ctx.strokeStyle = lg;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(200,180,255,0.9)';
    ctx.shadowBlur = 12;
    ctx.setLineDash([]); // сплошная!
    ctx.beginPath();
    ctx.moveTo(M.x, M.y);
    for (let si = 1; si <= 80; si++) {
      const spt = _quadBezier(M, ctrl, B, si/80);
      ctx.lineTo(spt.x, spt.y);
    }
    ctx.stroke();
    ctx.restore();

    // Точки городов — крупные
    [{ pt:M, c0:'rgba(200,180,255,0.5)' }, { pt:B, c0:'rgba(255,200,180,0.5)' }].forEach(({pt, c0}) => {
      const grd = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 22);
      grd.addColorStop(0, c0); grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(pt.x, pt.y, 22, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(pt.x, pt.y, 6, 0, Math.PI*2); ctx.fill();
    });

    // Лейблы
    const lm = document.getElementById('introLabelMoscow');
    const lb = document.getElementById('introLabelBishkek');
    if (lm) { lm.style.left = M.x+'px'; lm.style.top = M.y+'px'; lm.classList.add('visible'); }
    if (lb) { lb.style.left = B.x+'px'; lb.style.top = B.y+'px'; lb.classList.add('visible'); }
    const nm = document.getElementById('introNameMoscow');
    const nb = document.getElementById('introNameBishkek');
    if (nm) nm.textContent = (_skyCfg.moscow  || {}).cityLabel || '—';
    if (nb) nb.textContent = (_skyCfg.bishkek || {}).cityLabel || '—';

    // Текст — мгновенно
    typedEl.style.transition = 'none';
    typedEl.style.opacity = '1';
    typedEl.innerHTML = 'Мы ближе когда мы вместе ✦';

    // Кнопка — сразу
    btn.classList.add('visible');

    window._introSkipToEnd = null;
  };

  // Позиционируем лейблы точно над canvas-точками
  const _wrapRect = wrap.getBoundingClientRect();
  function _posLabel(id, pt) {
    const el = document.getElementById(id);
    el.style.left = pt.x + 'px';
    el.style.top  = pt.y + 'px';
  }
  _posLabel('introLabelMoscow',  M);
  _posLabel('introLabelBishkek', B);

  document.getElementById('introNameMoscow').textContent  = (_skyCfg.moscow  || {}).cityLabel || '—';
  document.getElementById('introNameBishkek').textContent = (_skyCfg.bishkek || {}).cityLabel || '—';

  // Звёзды на фоне интро
  const introEl = document.getElementById('skyIntro');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'intro-star';
    const sz = Math.random() < 0.15 ? 2.5 : Math.random() < 0.4 ? 1.5 : 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${-Math.random()*4}s;--op:${0.2+Math.random()*0.55};`;
    introEl.insertBefore(s, introEl.firstChild);
  }

  // Обновлять время городов
  function updateIntroCityTimes() {
    const _offM = (_skyCfg.moscow  || {}).offsetHours ?? 0;
    const _offB = (_skyCfg.bishkek || {}).offsetHours ?? 0;
    document.getElementById('introTimeMoscow').textContent  = realTimeStr(_offM);
    document.getElementById('introTimeBishkek').textContent = realTimeStr(_offB);
  }
  updateIntroCityTimes();
  const _citytimer = setInterval(updateIntroCityTimes, 10000);

  // ── Шаг 1: Печатаем вступление ────────────────────────
  await _delay(400);
  await _typeText(typedEl, 'два человека. одно сердце ❤️', 55);
  await _delay(600);

  // ── Шаг 2: Рисуем точку Москвы + подпись ──────────────
  // Рисуем точку Москвы на canvas
  ctx.clearRect(0,0,W,H);
  // Лёгкая сетка координат (очень тонкая)
  ctx.strokeStyle = 'rgba(100,120,200,0.07)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    ctx.beginPath(); ctx.moveTo(W*i/4, 0); ctx.lineTo(W*i/4, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H*i/4); ctx.lineTo(W, H*i/4); ctx.stroke();
  }

  // Анимировать появление точки Москвы
  let dotRad = 0;
  await new Promise(r => {
    const t0 = performance.now();
    function frame(now) {
      const p = Math.min((now-t0)/500, 1);
      const ease = Math.max(0, 1 - Math.pow(1-p, 3));
      dotRad = Math.max(0, 5 * ease);
      ctx.clearRect(M.x-20, M.y-20, 40, 40);
      // Halo
      const grd = ctx.createRadialGradient(M.x,M.y,0,M.x,M.y,Math.max(0.001,18*ease));
      grd.addColorStop(0,'rgba(200,180,255,0.35)');
      grd.addColorStop(1,'transparent');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(M.x,M.y,Math.max(0.001,18*ease),0,Math.PI*2); ctx.fill();
      // Dot
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(M.x, M.y, Math.max(0.001,dotRad), 0, Math.PI*2); ctx.fill();
      if (p < 1) requestAnimationFrame(frame); else r();
    }
    requestAnimationFrame(frame);
  });
  document.getElementById('introLabelMoscow').classList.add('visible');
  await _delay(300);

  // ── Шаг 3: Меняем текст на что-то про Москву ──────────
  // ── Шаг 4: Рисуем точку Бишкека ───────────────────────
  await new Promise(r => {
    const t0 = performance.now();
    function frame(now) {
      const p = Math.min((now-t0)/500, 1);
      const ease = Math.max(0, 1 - Math.pow(1-p, 3));
      ctx.clearRect(B.x-20, B.y-20, 40, 40);
      const grd = ctx.createRadialGradient(B.x,B.y,0,B.x,B.y,Math.max(0.001,18*ease));
      grd.addColorStop(0,'rgba(255,200,180,0.35)');
      grd.addColorStop(1,'transparent');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(B.x,B.y,Math.max(0.001,18*ease),0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(B.x, B.y, Math.max(0.001,5*ease), 0, Math.PI*2); ctx.fill();
      if (p < 1) requestAnimationFrame(frame); else r();
    }
    requestAnimationFrame(frame);
  });
  document.getElementById('introLabelBishkek').classList.add('visible');
  await _delay(300);

  // ── Шаг 6: Анимируем самолёт от Москвы до Бишкека ─────
  // _introSkipToEnd уже зарегистрирован выше

  // Сначала рисуем пунктирную линию маршрута постепенно
  const plane = document.createElement('div');
  plane.className = 'intro-plane';
  plane.textContent = '✈';
  wrap.appendChild(plane);

  // Рисуем маршрут (кривая) и летим по ней
  const FLIGHT_MS = 3000;
  let routeProgress = 0;

  await new Promise(r => {
    const t0 = performance.now();
    function frame(now) {
      const p = Math.min((now - t0) / FLIGHT_MS, 1);
      routeProgress = p;

      // Полностью перерисовываем canvas
      ctx.clearRect(0,0,W,H);

      // Сетка
      ctx.strokeStyle = 'rgba(100,120,200,0.07)'; ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        ctx.beginPath(); ctx.moveTo(W*i/4,0); ctx.lineTo(W*i/4,H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,H*i/4); ctx.lineTo(W,H*i/4); ctx.stroke();
      }

      // Точки городов
      [
        {pt:M, c0:'rgba(200,180,255,0.3)'},
        {pt:B, c0:'rgba(255,200,180,0.3)'}
      ].forEach(({pt,c0}) => {
        const grd = ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,18);
        grd.addColorStop(0,c0); grd.addColorStop(1,'transparent');
        ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(pt.x,pt.y,18,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(pt.x,pt.y,5,0,Math.PI*2); ctx.fill();
      });

      // Пройденная часть маршрута — светящаяся линия
      if (p > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(M.x, M.y);
        const steps = Math.floor(p * 60);
        for (let i = 1; i <= steps; i++) {
          const t = i/60;
          const pt = _quadBezier(M, ctrl, B, t);
          ctx.lineTo(pt.x, pt.y);
        }
        // Градиент вдоль линии
        const lg = ctx.createLinearGradient(M.x,M.y,B.x,B.y);
        lg.addColorStop(0,'rgba(200,180,255,0.9)');
        lg.addColorStop(1,'rgba(255,200,150,0.9)');
        ctx.strokeStyle = lg;
        ctx.shadowColor = 'rgba(200,180,255,0.6)';
        ctx.shadowBlur = 6;
        ctx.stroke();
        ctx.restore();
      }

      // Пунктир оставшегося пути (бледный)
      if (p < 0.98) {
        ctx.save();
        ctx.setLineDash([4,6]);
        ctx.strokeStyle = 'rgba(255,255,255,0.13)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const startT = p;
        const stPt = _quadBezier(M, ctrl, B, startT);
        ctx.moveTo(stPt.x, stPt.y);
        for (let i = 1; i <= 30; i++) {
          const t2 = startT + (1-startT)*i/30;
          const pt2 = _quadBezier(M, ctrl, B, t2);
          ctx.lineTo(pt2.x, pt2.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Позиция самолёта
      const planePos = _quadBezier(M, ctrl, B, p);
      const planeNext = _quadBezier(M, ctrl, B, Math.min(p+0.01, 1));
      const angle = Math.atan2(planeNext.y - planePos.y, planeNext.x - planePos.x) * 180 / Math.PI;
      plane.style.left = (planePos.x - 10) + 'px';
      plane.style.top  = (planePos.y - 10) + 'px';
      plane.style.transform = `rotate(${angle}deg)`;
      plane.style.opacity = String(Math.min(p * 10, 1));

      if (p < 1 && !_introAborted) requestAnimationFrame(frame);
      else {
        plane.style.opacity = '0';
        setTimeout(() => plane.remove(), 200);
        r();
      }
    }
    requestAnimationFrame(frame);
  });

  await _delay(200);

  // ── Шаг 7: Текст на маршруте — 3 фразы ───────────────
  // Координата середины дуги
  // Фразы маршрута печатаем в основном typedEl внизу

  const _distTxt = _skyCfg.distanceLabel ? _skyCfg.distanceLabel + ' между нами' : 'далеко между нами';
  const phrases = [
    { text: _distTxt, type: 48, erase: 30 },
    { text: 'я так сильно жду этой встречи ❤️', type: 42, erase: 0 },
  ];

  for (let i = 0; i < phrases.length; i++) {
    const ph = phrases[i];
    if (i === 0) await _eraseText(typedEl, 28);
    await _typeText(typedEl, ph.text, ph.type);
    await _delay(i < 2 ? 1800 : 2000);
    if (ph.erase) await _eraseText(typedEl, ph.erase);
  }

  await _delay(500);

  // ── Шаг 8: Финальный текст + кнопка ──────────────────
  await _eraseText(typedEl, 28);
  await _delay(200);
  // ── ЭКГ: пульс на маршруте ─────────────────────────────
  await _drawHeartbeat(introCanvas, M, B);

  await _typeText(typedEl, 'Мы ближе когда мы вместе ✦', 50);

  clearInterval(_citytimer);

  // Показываем кнопку
  await _delay(600);
  btn.classList.add('visible');
}


// ════════════════════════════════════════════
//  SKIP INTRO — двойной тап
// ════════════════════════════════════════════
let _skipLastTap = 0;
let _skipNotifVisible = false;
let _skipNotifTimer = null;

function _initSkipDoubleTap() {
  const intro = document.getElementById('skyIntro');
  if (!intro) return;

  function _handleTap() {
    const now = Date.now();
    const diff = now - _skipLastTap;

    if (_skipLastTap > 0 && diff < 500) {
      // Второй тап — достаточно быстро после первого
      _skipLastTap = 0;
      _showSkipNotif();
    } else {
      // Первый тап — просто запоминаем время
      _skipLastTap = now;
      // Сбрасываем через 600мс если второго не последовало
      setTimeout(() => {
        if (Date.now() - _skipLastTap >= 500) _skipLastTap = 0;
      }, 600);
    }
  }

  intro.addEventListener('click', function(e) {
    if (e.target.closest('#introSkipNotif') || e.target.closest('#introBtnEnter')) return;
    _handleTap();
  });

  // Touch — используем только touchend, чтобы не было двойного срабатывания с click
  intro.addEventListener('touchend', function(e) {
    if (e.target.closest('#introSkipNotif') || e.target.closest('#introBtnEnter')) return;
    e.preventDefault(); // блокируем синтетический click после touch
    _handleTap();
  }, { passive: false });
}

function _showSkipNotif() {
  if (_skipNotifVisible) return;
  const notif = document.getElementById('introSkipNotif');
  if (!notif) return;
  _skipNotifVisible = true;
  notif.classList.add('visible');

  // Авто-скрытие через 4 секунды если не нажали
  if (_skipNotifTimer) clearTimeout(_skipNotifTimer);
  _skipNotifTimer = setTimeout(() => {
    _hideSkipNotif();
  }, 4000);
}

function _hideSkipNotif() {
  const notif = document.getElementById('introSkipNotif');
  if (!notif) return;
  _skipNotifVisible = false;
  notif.classList.remove('visible');
  if (_skipNotifTimer) { clearTimeout(_skipNotifTimer); _skipNotifTimer = null; }
}

function _doSkipIntro() {
  _hideSkipNotif();
  _introAborted = true;

  // Сразу убиваем самолёт и ЭКГ overlay-canvas
  document.querySelectorAll('.intro-plane').forEach(el => el.remove());
  const introWrap = document.getElementById('introMapWrap');
  if (introWrap) {
    introWrap.querySelectorAll('canvas:not(#introCanvas)').forEach(el => el.remove());
  }

  // Вызываем финальное состояние — оно зарегистрировано внутри runIntroAnimation
  // и имеет доступ ко всем canvas-переменным через замыкание
  if (typeof window._introSkipToEnd === 'function') {
    window._introSkipToEnd();
  } else {
    // Fallback если анимация ещё не дошла до регистрации ctrl
    const typedEl = document.getElementById('introTyped');
    const btn     = document.getElementById('introBtnEnter');
    if (typedEl) { typedEl.style.transition = 'none'; typedEl.innerHTML = 'Мы ближе когда мы вместе ✦'; }
    if (btn)     btn.classList.add('visible');
    document.getElementById('introLabelMoscow')?.classList.add('visible');
    document.getElementById('introLabelBishkek')?.classList.add('visible');
  }
}

function openSkyIntro() {
  if (!_weatherLoaded) _weatherPromise = fetchWeatherData();
  const intro = document.getElementById('skyIntro');
  intro.classList.add('active');
  // Инициализируем двойной тап для скипа (один раз)
  if (!intro._skipInited) { intro._skipInited = true; _initSkipDoubleTap(); }
  runIntroAnimation();
}

async function enterSky() {
  // Ждём погоду (должна загрузиться за время анимации интро ~15 сек)
  if (!_weatherLoaded) {
    try { await Promise.race([_weatherPromise, new Promise(r => setTimeout(r, 2500))]); }
    catch(e) {}
  }
  const intro = document.getElementById('skyIntro');
  intro.classList.add('fade-out');
  intro.addEventListener('animationend', () => {
    intro.classList.remove('active','fade-out');
    intro.style.display = 'none';
  }, { once: true });

  // Открываем небо
  const view = document.getElementById('skyView');
  view.style.display = 'block';
  view.style.animation = 'skyIn 0.5s cubic-bezier(0.4,0,0.2,1) both';
  const role    = getUserRole();
  const myPanel = _getPanelForRole(role);
  _applySingleMode(myPanel);
  renderSkyFrame();
  // rAF-цикл: солнце/луна каждый кадр (плавно), фон/облака раз в 2 сек
  function _skyRafLoop() {
    _skyInterval = requestAnimationFrame(_skyRafLoop);
    const now = performance.now();
    if (now - _lastSlowUpdate > 2000) {
      _lastSlowUpdate = now;
      Object.entries(CITIES).forEach(([key, city]) => {
        const hour = getHour(city.offset);
        const sky  = _getSkyForCity(key, hour);
        drawSkyCanvas(city.el, sky);
        updateStars(key, sky.stars);
        ensureClouds(key, sky);
        const hz = document.getElementById('horizon' + city.el);
        hz.style.background = sky.hor
          ? `linear-gradient(transparent, ${sky.hor})`
          : 'linear-gradient(transparent, transparent)';
        const au = document.getElementById('aurora' + city.el);
        au.style.opacity = (sky.stars > 0.8 && Math.random() > 0.65) ? '1' : '0';
        document.getElementById(city.nameEl).textContent  = getTimeStr(city.offset);
        document.getElementById(city.phaseEl).textContent = sky.phase;

        // Погода — правая колонка
        const wEl = document.getElementById('weather' + city.el);
        if (wEl) {
          const wd = WEATHER_DATA[key];
          if (wd && wd.temp != null && !wEl._weatherDone) {
            wEl._weatherDone = true;
            wEl.innerHTML = '';
            const icon = _weatherIcon(wd.code);

            const t = document.createElement('div');
            t.className = 'weather-temp';
            t.textContent = Math.round(wd.temp) + '°C';
            wEl.appendChild(t);

            if (wd.feels != null) {
              const f = document.createElement('div');
              f.className = 'weather-feels';
              f.textContent = 'Ощущается как ' + Math.round(wd.feels) + '°C';
              wEl.appendChild(f);
            }

            if (wd.desc) {
              const b = document.createElement('div');
              b.className = 'weather-badge';
              b.textContent = (icon ? icon + ' ' : '') + wd.desc;
              wEl.appendChild(b);
            }
          }
        }
      });
    }
    // Солнце и луна — каждый кадр
    Object.entries(CITIES).forEach(([key, city]) => {
      const hour = getHour(city.offset);
      const sky  = _getSkyForCity(key, hour);
      updateSunMoon(key, hour, sky);
    });
  }
  _skyRafLoop();
  if (!_wsConn) initSkyWS();
  _checkInboxOnLoad();
  _startInboxPoll();
  _initSentCounter();
  _log('Sky', 'enterSky done, panel=' + _activePanel);
}
